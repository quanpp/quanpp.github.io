<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1257C4"/>
      <stop offset="55%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C8FBFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C8FBFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- 柔光 -->
  <circle cx="640" cy="120" r="300" fill="url(#glow1)"/>
  <circle cx="160" cy="520" r="280" fill="url(#glow2)"/>

  <!-- 同心圆环 -->
  <circle cx="640" cy="140" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="640" cy="140" r="105" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="640" cy="140" r="155" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- 左下点阵 -->
  <g fill="#ffffff" fill-opacity="0.25">
    <circle cx="120" cy="480" r="3"/><circle cx="170" cy="480" r="3"/><circle cx="220" cy="480" r="3"/><circle cx="270" cy="480" r="3"/>
    <circle cx="120" cy="520" r="3"/><circle cx="170" cy="520" r="3"/><circle cx="220" cy="520" r="3"/><circle cx="270" cy="520" r="3"/>
    <circle cx="120" cy="560" r="3"/><circle cx="170" cy="560" r="3"/><circle cx="220" cy="560" r="3"/><circle cx="270" cy="560" r="3"/>
  </g>

  <!-- 流动曲线 -->
  <path d="M -20 380 C 200 300, 380 460, 620 340 S 780 260, 820 300" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M -20 430 C 220 360, 420 500, 640 390 S 800 320, 820 350" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- 右下多边形线框 -->
  <path d="M 700 470 L 760 505 L 760 570 L 700 600 L 650 570 L 650 505 Z" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="1.5"/>
</svg>
